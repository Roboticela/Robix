<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robix UI Demo</title>
<style>
:root{color-scheme:light dark;--window:#F4F5F7;--text:#1A1A1A;}
@media (prefers-color-scheme: dark){:root{--window:#14161A;--text:#E6E6E6;}}
html[data-theme="dark"]{--window:#14161A;--text:#E6E6E6;}
html[data-theme="light"]{--window:#F4F5F7;--text:#1A1A1A;}
body{margin:0;background:var(--window);color:var(--text);font:16px sans-serif;}
main{box-sizing:border-box;width:100%;max-width:320px;min-height:180px;padding:16px;background:#f4f5f7;color:#1a1a1a;}
h1{margin:0;font-size:16px;font-weight:600;}
</style>
</head>
<body>
<main id="RobotDashboard" data-component="Window">
<h1>Robix UI Demo</h1>
</main>
</body>
</html>
