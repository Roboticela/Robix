    <path d="M333 122 446 256 333 390" stroke="#16E8A5" stroke-width="37"/>
    <!-- robotic connectors -->
    <path d="M202 256h108M256 178v156" stroke="#F8FAFC" stroke-width="39"/>
    <path d="M202 256h108M256 178v156" stroke="#10203B" stroke-width="29"/>
