name: Robix

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld zip unzip xz-utils curl

      - name: Compile the Linux toolchain
        run: bash .github/scripts/package-toolchain.sh
        env:
          SKIP_WINDOWS: "1"

      - name: Cross-compile the Windows interpreter and compiler
        run: bash .github/scripts/cross-compile-windows.sh

      - name: Upload Windows language tools
        uses: actions/upload-artifact@v4
        with:
          name: robix-windows-tools
          path: dist/windows-tools
          if-no-files-found: error

      - name: Package the VS Code extension
        run: node .github/scripts/package-vsix.js

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: robix-linux-packages
          path: |
            dist/robix-linux-x64.zip
            dist/Update-*-linux-x64.zip
            dist/Roboticela.Robix.vsix
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: build-linux
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install tools
        run: choco install zip unzip -y

      - name: Download the Windows language tools
        uses: actions/download-artifact@v4
        with:
          name: robix-windows-tools
          path: dist/windows-tools

      - name: Compile the Windows toolchain
        shell: bash
        run: bash .github/scripts/package-windows.sh

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: robix-windows-packages
          path: |
            dist/robix-windows-x64.zip
            dist/Update-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: robix-linux-packages
          path: dist

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: robix-windows-packages
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bash .github/scripts/version.sh)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="latest"
          fi
          title="Robix ${version}"
          shopt -s nullglob
          updates=(dist/Update-*.zip)
          if [ "${#updates[@]}" -eq 0 ]; then
            echo "error: Update-${version} archives were not found" >&2
            exit 1
          fi
          notes="$(mktemp)"
          cat > "${notes}" <<EOF
          ## Tools ${version}

          The version is written in \`Robix/VERSION.txt\`.

          Unzip the full archive for a new install. llc and lld are already inside it.

          Linux:

          \`\`\`bash
          unzip robix-linux-x64.zip
          export PATH=\"\$PWD/Robix/Bin:\$PATH\"
          Robix run Hello.rx
          Robixc SourceFolder Program
          \`\`\`

          Windows:

          \`\`\`powershell
          Expand-Archive robix-windows-x64.zip
          \$env:PATH = \"\$PWD\\Robix\\Bin;\$env:PATH\"
          Robix.exe run Hello.rx
          Robixc.exe SourceFolder Program.exe
          \`\`\`

          \`Robix.exe\` and \`Robixc.exe\` are located in \`Robix\\Bin\`.

          ## Update

          \`Update-${version}-linux-x64.zip\` and \`Update-${version}-windows-x64.zip\` contain the same Robix files without LLVM. Unzip the matching archive over an existing \`Robix\` folder. \`Shared/Tools/Llvm\` and \`Library/Link\` stay where they are.

          ## Editor

          In VS Code or Cursor, choose **Extensions: Install from VSIX** and select \`Roboticela.Robix.vsix\`.
          The editor finds \`Robix\` and \`Robixc\` on \`PATH\`.
          EOF
          sed -i 's/^          //' "${notes}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --cleanup-tag --yes
          fi
          create_args=(--target "${GITHUB_SHA}" --title "${title}" --notes-file "${notes}")
          if [ "${tag}" = "latest" ]; then
            create_args+=(--latest)
          fi
          gh release create "${tag}" \
            dist/robix-linux-x64.zip \
            dist/robix-windows-x64.zip \
            "${updates[@]}" \
            dist/Roboticela.Robix.vsix \
            "${create_args[@]}"
