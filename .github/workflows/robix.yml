name: Robix

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            script: package-toolchain.sh
          - platform: windows-x64
            os: ubuntu-24.04
            script: cross-compile-windows.sh
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the host toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld zip unzip xz-utils curl

      - name: Compile ${{ matrix.platform }}
        run: bash .github/scripts/${{ matrix.script }}
        env:
          SKIP_WINDOWS: "1"

      - name: Upload the Linux packages
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: robix-packages-linux-x64
          path: |
            dist/*.zip
          if-no-files-found: error

      - name: Upload the compiled packages
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: robix-bins
          path: Build/Compiler/*
          if-no-files-found: error

      - name: Upload the Windows language tools
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: robix-windows-tools
          path: dist/windows-tools/*
          if-no-files-found: error

  editor:
    name: Package editor
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Package the VS Code extension
        run: node .github/scripts/package-vsix.js

      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: robix-packages-editor
          path: dist/*.vsix
          if-no-files-found: error

  package-windows:
    name: Package windows-x64
    needs: compile
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install tools
        run: choco install zip unzip -y

      - name: Download the Windows language tools
        uses: actions/download-artifact@v4
        with:
          name: robix-windows-tools
          path: dist/windows-tools

      - name: Download the compiled packages
        uses: actions/download-artifact@v4
        with:
          name: robix-bins
          path: Build/Compiler

      - name: Package Windows
        shell: bash
        run: bash .github/scripts/package-windows.sh

      - name: Upload the Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: robix-packages-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  architectures:
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-arm64
            packages: g++-aarch64-linux-gnu
            cxx: aarch64-linux-gnu-g++
          - target: linux-arm
            packages: g++-arm-linux-gnueabihf
            cxx: arm-linux-gnueabihf-g++
          - target: linux-riscv64
            packages: g++-riscv64-linux-gnu
            cxx: riscv64-linux-gnu-g++
          - target: linux-ppc64le
            packages: g++-powerpc64le-linux-gnu
            cxx: powerpc64le-linux-gnu-g++
          - target: linux-s390x
            packages: g++-s390x-linux-gnu
            cxx: s390x-linux-gnu-g++
          - target: linux-loongarch64
            packages: g++-14-loongarch64-linux-gnu
            cxx: loongarch64-linux-gnu-g++-14
          - target: windows-arm64
            packages: ""
            cxx: aarch64-w64-mingw32-clang++
          - target: windows-x86
            packages: ""
            cxx: i686-w64-mingw32-clang++
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zip unzip xz-utils curl ${{ matrix.packages }}

      - name: Package ${{ matrix.target }}
        run: bash .github/scripts/package-foreign.sh
        env:
          ROBIX_TARGET: ${{ matrix.target }}
          ROBIX_CXX: ${{ matrix.cxx }}

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: robix-packages-${{ matrix.target }}
          path: |
            dist/robix-*.zip
            dist/Update-*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [compile, editor, package-windows, architectures]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: robix-packages-*
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bash .github/scripts/version.sh)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="latest"
          fi
          title="Robix ${version}"
          shopt -s nullglob
          updates=(dist/Update-*.zip)
          if [ "${#updates[@]}" -eq 0 ]; then
            echo "error: Update-${version} archives were not found" >&2
            exit 1
          fi
          for required in \
            dist/robix-linux-x64.zip dist/robix-linux-arm64.zip dist/robix-linux-arm.zip \
            dist/robix-linux-riscv64.zip dist/robix-linux-ppc64le.zip dist/robix-linux-s390x.zip \
            dist/robix-linux-loongarch64.zip \
            dist/robix-windows-x64.zip dist/robix-windows-arm64.zip dist/robix-windows-x86.zip \
            dist/Roboticela.Robix.vsix
          do
            if [ ! -f "$required" ]; then
              echo "error: ${required} was not downloaded" >&2
              find dist -type f >&2 || true
              exit 1
            fi
          done
          for archive in dist/robix-*.zip; do
            name="$(basename "$archive" .zip)"
            name="${name#robix-}"
            if [ ! -f "dist/Update-${version}-${name}.zip" ]; then
              echo "error: dist/Update-${version}-${name}.zip was not downloaded" >&2
              exit 1
            fi
          done
          notes="$(mktemp)"
          cat > "${notes}" <<EOF
          ## Tools ${version}

          The version is written in \`Robix/VERSION.txt\`.

          Unzip the archive that matches the machine. Each archive contains \`Bin/RobixBootstrap\` for the next build on that architecture.

          Linux: \`robix-linux-x64.zip\`, \`robix-linux-arm64.zip\`, \`robix-linux-arm.zip\`, \`robix-linux-riscv64.zip\`, \`robix-linux-ppc64le.zip\`, \`robix-linux-s390x.zip\`, \`robix-linux-loongarch64.zip\`.

          Windows: \`robix-windows-x64.zip\`, \`robix-windows-arm64.zip\`, \`robix-windows-x86.zip\`.

          \`\`\`bash
          unzip robix-linux-x64.zip
          export PATH=\"\$PWD/Robix/Bin:\$PATH\"
          Robix run Hello.rx
          Robixc SourceFolder Program
          \`\`\`

          \`\`\`powershell
          Expand-Archive robix-windows-x64.zip
          \$env:PATH = \"\$PWD\\Robix\\Bin;\$env:PATH\"
          Robix.exe run Hello.rx
          Robixc.exe SourceFolder Program.exe
          \`\`\`

          ## Update

          \`Update-${version}-<system>-<arch>.zip\` contains the same Robix files without LLVM. Unzip the matching archive over an existing \`Robix\` folder. \`Shared/Tools/Llvm\` and \`Library/Link\` stay where they are.

          ## Editor

          In VS Code or Cursor, choose **Extensions: Install from VSIX** and select \`Roboticela.Robix.vsix\`.
          The editor finds \`Robix\` and \`Robixc\` on \`PATH\`.
          EOF
          sed -i 's/^          //' "${notes}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release delete "${tag}" --cleanup-tag --yes
          fi
          create_args=(--target "${GITHUB_SHA}" --title "${title}" --notes-file "${notes}")
          if [ "${tag}" = "latest" ]; then
            create_args+=(--latest)
          fi
          mapfile -t archives < <(printf '%s\n' dist/robix-*.zip dist/Update-*.zip | sort)
          gh release create "${tag}" \
            "${archives[@]}" \
            dist/Roboticela.Robix.vsix \
            "${create_args[@]}"
